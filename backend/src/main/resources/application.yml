spring:
  application:
    name: mch-surveillance-backend
  datasource:
    url: jdbc:h2:mem:mch;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Comma-separated list of origins allowed to call the API (Flutter web / dev).
mch:
  cors:
    allowed-origins: "*"
