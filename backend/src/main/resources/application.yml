spring:
  application:
    name: mch-surveillance-backend
  datasource:
    # File-based H2 so data survives restarts during local testing.
    # The DB file lands in backend/data/mch.mv.db — delete it to reset.
    url: jdbc:h2:file:./data/mch;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Comma-separated list of origins allowed to call the API (Flutter web / dev).
mch:
  cors:
    allowed-origins: "*"
